name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r sound/requirements.txt
      - run: npm install -g vite-plus@1.1.0
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: npx tsc --noEmit -p .
      - run: vp test run
